services:

  # ==========================================
  # Business Laravel
  # ==========================================
  business-service:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8002:8000"

    volumes:
      - .:/var/www/html
      - business-vendor:/var/www/html/vendor
      - /opt/smartpos/secrets/identity-jwt/public.pem:/run/secrets/identity-jwt/public.pem:ro

    depends_on:
      business-mysql:
        condition: service_healthy

      business-redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - business-network
      - business-smartpos-network

  # ==========================================
  # Business MySQL
  # ==========================================
  business-mysql:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - business-mysql-data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

    networks:
      business-network:
        aliases:
          - mysql

  # ==========================================
  # Business Redis
  # ==========================================
  business-redis:
    image: redis:8-alpine

    volumes:
      - business-redis-data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    networks:
      business-network:
        aliases:
          - redis

  # ==========================================
  # Business phpMyAdmin
  # ==========================================
  business-phpmyadmin:
    image: phpmyadmin:5

    ports:
      - "127.0.0.1:8082:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M

    depends_on:
      business-mysql:
        condition: service_healthy

    restart: unless-stopped

    profiles:
      - tools

    networks:
      - business-network

# ==========================================
# Networks
# ==========================================
networks:

  business-network:
    driver: bridge

  business-smartpos-network:
    name: smartpos-network
    external: true

# ==========================================
# Volumes
# ==========================================
volumes:

  business-mysql-data:

  business-redis-data:

  business-vendor:
