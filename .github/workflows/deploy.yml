name: Deploy Business Service

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: smartpos-business-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Business Service
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Business Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}

          script_stop: true
          command_timeout: 30m

          script: |
            set -e

            echo "============================================"
            echo "🚀 SmartPOS Business Service Deployment"
            echo "============================================"

            cd /opt/smartpos/business-service

            echo "💾 Backup database"
            if [ -x /opt/smartpos/backups/scripts/backup-business-db.sh ]; then
              /opt/smartpos/backups/scripts/backup-business-db.sh || true
            fi

            echo "⬇️ Pull latest code"
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "🔑 Ensuring JWT public key exists"
            [ -d storage/certs/public.pem ] && rm -rf storage/certs/public.pem || true
            mkdir -p storage/certs 2>/dev/null || true
            if [ -f /opt/smartpos/secrets/identity-jwt/public.pem ]; then
              cp -f /opt/smartpos/secrets/identity-jwt/public.pem storage/certs/public.pem
            elif [ -f ../secrets/identity-jwt/public.pem ]; then
              cp -f ../secrets/identity-jwt/public.pem storage/certs/public.pem
            elif [ -f /opt/smartpos/identity-service/storage/certs/public.pem ]; then
              cp -f /opt/smartpos/identity-service/storage/certs/public.pem storage/certs/public.pem
            fi
            chmod 644 storage/certs/*.pem 2>/dev/null || true

            COMPOSE_FILE="docker-compose.yml"
            [ -f "docker-compose.prod.yml" ] && COMPOSE_FILE="docker-compose.prod.yml"
            echo "🐳 Using compose file: ${COMPOSE_FILE}"

            echo "🐳 Build containers"
            docker compose -f "${COMPOSE_FILE}" build business-service

            echo "🚀 Start services"
            docker compose -f "${COMPOSE_FILE}" up -d \
              business-mysql \
              business-redis \
              business-service

            echo "⏳ Wait for application"
            sleep 10

            echo "🗄 Run migrations"
            docker compose -f "${COMPOSE_FILE}" exec -T business-service \
              php artisan migrate --force

            echo "🧹 Clear cache"
            docker compose -f "${COMPOSE_FILE}" exec -T business-service \
              php artisan optimize:clear

            # Reload API Gateway so Nginx upstream immediately connects to new container
            if docker ps --format '{{.Names}}' | grep -q "api-gateway"; then
              docker exec -i smartpos-api-gateway nginx -s reload 2>/dev/null || true
            fi

            echo "📋 Status"
            docker compose -f "${COMPOSE_FILE}" ps

            echo "✅ Deployment complete"

      - name: Health Check
        run: |
          echo "Checking Business Service from GitHub runner..."
          curl \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            https://smartpos-api.servicefixit.me/api/v1/business/health

          echo ""
          echo "✅ Business Service is healthy"

      - name: Deployment Summary
        if: success()
        run: |
          echo "## ✅ SmartPOS Business Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Service:** Business Service" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** production" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** Healthy ✅" >> "$GITHUB_STEP_SUMMARY"